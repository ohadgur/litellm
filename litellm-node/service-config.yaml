[all]:
  server:
    port: 7100
  gateway:
    routing_strategy: simple-shuffle
    model_list:
      - model_name: gpt-4o
        litellm_params:
          model: openai/gpt-4o
          api_key: ${OPENAI_API_KEY}
      - model_name: claude-sonnet
        litellm_params:
          model: anthropic/claude-sonnet-4-20250514
          api_key: ${ANTHROPIC_API_KEY}
